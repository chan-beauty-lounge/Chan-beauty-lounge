<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c78f9d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>CHAN Beauty Lounge</title>

<style>
:root{
--pink:#c78f9d;
--rose:#b97989;
--ivory:#fbf6f2;
--ink:#292526;
--muted:#756b6d;
--line:#eadfe0;
--soft:#f4e7ea;
--white:#fff;
--green:#66876e;
--red:#a85e66
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--ivory);
color:var(--ink);
font-family:Arial,sans-serif
}

header{
background:linear-gradient(135deg,#dfbcc3,#b97989);
color:#fff;
padding:18px;
position:sticky;
top:0;
z-index:10
}

.brand{
font:700 25px Georgia,serif
}

.tag{
font-size:12px;
margin-top:3px
}

main{
max-width:1000px;
margin:auto;
padding:16px 16px 90px
}

nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid var(--line);
display:grid;
grid-template-columns:repeat(6,1fr);
z-index:20
}

nav button{
border:0;
background:none;
padding:8px 2px;
color:var(--muted);
font-size:10px
}

nav button.active{
color:var(--rose);
font-weight:bold
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:16px;
padding:15px;
margin:12px 0;
box-shadow:0 2px 10px #7d596110
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.stat{
background:var(--soft);
border-radius:14px;
padding:13px
}

.stat b{
display:block;
font-size:20px;
margin-top:4px
}

.label,.small{
font-size:12px;
color:var(--muted)
}

h2{
font:700 24px Georgia,serif;
margin:5px 0 14px
}

h3{
margin:0 0 9px
}

.row{
display:flex;
gap:8px;
align-items:center
}

.row>*{
flex:1
}

input,select,textarea{
width:100%;
padding:10px;
border:1px solid #dcc9ce;
border-radius:10px;
background:#fff;
margin:4px 0 9px;
font-size:14px
}

textarea{
min-height:75px
}

button.primary{
background:var(--rose);
color:#fff;
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold
}

.secondary{
background:#f1e2e6;
color:var(--rose);
border:0;
border-radius:10px;
padding:9px 12px
}

.danger{
background:#faeeee;
color:var(--red);
border:0;
border-radius:10px;
padding:9px 12px
}

.item{
padding:11px 0;
border-bottom:1px solid #eee
}

.item:last-child{
border-bottom:0
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:20px;
background:#f2e3e7;
color:var(--rose);
font-size:11px
}

.empty{
text-align:center;
color:var(--muted);
padding:22px
}

.thumb{
width:76px;
height:76px;
object-fit:cover;
border-radius:10px;
margin-top:6px;
border:1px solid var(--line)
}

.target{
height:10px;
background:#eee;
border-radius:20px;
overflow:hidden
}

.target span{
display:block;
height:100%;
background:var(--rose)
}

.completed{
background:#e8f1e9;
color:var(--green)
}

.cancelled{
background:#faeeee;
color:var(--red)
}

@media(min-width:700px){
.grid{
grid-template-columns:repeat(4,1fr)
}

nav{
position:static;
max-width:1000px;
margin:auto
}

main{
padding-bottom:20px
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
}
</style>
</head>
